# Gera o .exe do Windows e publica um Release sempre que uma tag de versão (v*) é enviada.
# As notas do release vêm de release-notes/<tag>.md (se existir).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot e templates de exportação
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d "$RUNNER_TEMP/tpl"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP"/tpl/templates/windows_* "$RUNNER_TEMP"/tpl/templates/version.txt "$dest/"
          rm -rf "$RUNNER_TEMP/tpl" ./*.zip ./*.tpz

      - name: Importar projeto
        run: timeout 300 "$RUNNER_TEMP/godot" --headless --path . --import || true

      - name: Testes
        run: timeout 300 "$RUNNER_TEMP/godot" --headless --path . res://tests/test_build.tscn

      - name: Exportar para Windows
        run: |
          mkdir -p build
          timeout 600 "$RUNNER_TEMP/godot" --headless --path . --export-release "Windows Desktop" build/Sucata.exe
          test -s build/Sucata.exe

      - name: Empacotar
        run: |
          mkdir -p pkg/Sucata
          cp build/Sucata.exe dist/* pkg/Sucata/
          (cd pkg && zip -q -r -9 "../Sucata-${GITHUB_REF_NAME}-windows.zip" Sucata)

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "Sucata-${GITHUB_REF_NAME}-windows.zip" \
              --title "Sucata ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "Sucata-${GITHUB_REF_NAME}-windows.zip" \
              --title "Sucata ${GITHUB_REF_NAME}" --generate-notes
          fi
